/* ===== Motore turni PS Susa ===== */
const ENGINE = (function () {
  'use strict';

  /* Elenco dei festivi dell'anno: {m, d, name, sup} */
  function holidayList(y) {
    const out = [];
    Object.keys(HOLNAMES).forEach(k => { const [m, d] = k.split('-').map(Number); out.push({ m, d, name: HOLNAMES[k], sup: !!SUPER_DEFAULT[k] }); });

  function makeCtx(year, month, hol) {
    const D = new Date(year, month + 1, 0).getDate();
    const off = (new Date(year, month, 1).getDay() + 6) % 7;

  /* Schema di un fine settimana per un medico: venerdì notte, sabato giorno/notte, domenica giorno/notte.

     lim: {capH: tetto di ore del mese per la media di 48 h, weekTot: massimo turni a settimana} */

    const { D, wk, nW } = ctx;
    const capH = lim ? lim.capH : 1e9, weekTot = lim ? lim.weekTot : 5;
    let v = 0, nights = 0, nTot = 0, prevEnd = -1, run = 0, runLast = -9; const rests = []; const stretches = [];

    for (let d = 1; d <= D; d++) {
      const x = s[d]; if (!x) continue;
      const kk = x & 3, pa = x & 4, bb = b[d];

  function prep(cfg) {

    const blk = [], R = [], R0 = [], T = [], credit = [], wcr = [], hh = [], capH = [], adj = [];
    const weekTot = (cfg.opts && cfg.opts.weekTot) || 5;
    strut.forEach(x => {
      const a = new Int8Array(D + 2), dd = (cfg.desid && cfg.desid[x.id]) || {};

      for (let d = 1; d <= D; d++) {

      const base = Math.round(DAILY * ctx.workdays * 10) / 10;
      const ad = Math.max(-24, Math.min(24, h.saldo || 0));
      blk.push(a); credit.push(Math.round(cr * 10) / 10); T.push(base); wcr.push(wc); hh.push(h); adj.push(ad);
      R0.push(Math.max(0, Math.round((base - cr) * 10) / 10));
      R.push(Math.max(0, Math.round((base - cr - ad) * 10) / 10));
      const winDays = D + (h.prevDays || 0);
      capH.push(Math.max(0, 48 * winDays / 7 - (h.prevHours || 0)));

    return { ctx, strut, blk, R, R0, T, credit, wcr, hh, capH, adj, weekTot };
  }

  function parseCells(cells, D) {
    const grid = [];

    for (const key in (cells || {})) {
      let v = cells[key]; if (!v) continue;

  function generate(cfg) {
    const P = prep(cfg); const { ctx, strut, blk, R, wcr, hh, capH, weekTot } = P;
    const { D, wk, weC, fest, nW, fullWeek, isHol } = ctx;
    const docs = cfg.docs, nS = strut.length;
    const sIdx = {}; strut.forEach((x, i) => sIdx[x.id] = i);
    const supSet = new Set(cfg.supers || []);
    const lims = strut.map((_, j) => ({ capH: capH[j], weekTot }));

    const grid = [];

      const Dl = [], Nl = [], Bl = [];
      for (const x of docs) {
        if (x.kind === 'S') continue;
        const code = ((cfg.avail && cfg.avail[x.id]) || {})[d];

    const offs = hh.map(() => ({}));

      const has = new Set(); grid[d].forEach(c => { if (c) has.add(c.id); });
      const cmp = (a, b) => ((a.prio || 9) - (b.prio || 9)) || ((extCount[a.id] || 0) - (extCount[b.id] || 0));

  function analyze(cfg, cells) {

const PDFGRID = (function () {
  function build(JsPDF, o) {
    // o: { title:'Novembre 2026', rows:[{label:'dom 1/11', fest:true, cells:[m1,m2,notte,bi]}] }
    const doc = new JsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

    const cw = [112, 142, 148, 138, 138, 138, 115, 109].map(w => w * px);
    const x0 = 14, y0 = 14;
    const n = o.rows.length;

    const W = colX[colX.length - 1] - x0;
    const yG = y0 + hTitle, yS = yG + hGroup, yR = yS + hSub, H = yR + n * hRow - y0;

        </div></div>
      <div class="card"><h2>Festivi</h2>
        <p class="small muted" style="margin-bottom:10px">Sabato e domenica sono già esclusi. Tocca un giorno per segnarlo o toglierlo come festivo.</p>
        <div class="cal">${cal}</div></div>
      <div class="card"><h2>Ore da coprire con i turni</h2>

        <ul class="list">${strut.map(x => { const s = an.stats[x.id]; return `<li class="row" style="justify-content:space-between"><span>${x.name}</span><span class="mono small">${fmt(s.R)} h${s.credit ? ` <span class="muted">(− ${fmt(s.credit)})</span>` : ''}</span></li>`; }).join('')}</ul></div>

      <div class="card"><h2>Regole applicate</h2><ul class="rules">
        <li>Turni da 12 ore: due sale di accettazione di giorno, una di notte. La sala a bassa intensità si apre solo con un gettonista disponibile.</li>
        <li>Le disponibilità di Pinerolo, 118, Medicina e gettonisti vengono sempre usate, se inserite. Se mancano (anche solo di alcuni), gli strutturati coprono quello che possono e i buchi rimasti si comunicano agli esterni dalla scheda Turni.</li>
        <li>Dopo una notte il giorno seguente è libero. Massimo 5 notti e 2 fine settimana per strutturato; un terzo fine settimana solo se manca gente, da recuperare il mese dopo. Un fine settimana conta dal sabato: la domenica del giorno 1 appartiene al mese prima.</li>
        <li>Legge 161 e D.Lgs. 66/2003: media di 48 ore a settimana comprese le PA (su 4 mesi, usando lo storico), almeno 11 ore di riposo tra due turni, almeno 24 ore consecutive di riposo ogni 7 giorni (con le 11 ore: 35). Al massimo 4 turni ordinari a settimana, più una PA come quinto turno (al massimo 2 PA al mese per medico) e 5 giorni di lavoro di seguito. Il riposo di 24 ore a settimana è calcolato come media su 14 giorni. Le 24 ore minime a settimana sono un obiettivo, non un obbligo.</li>
        <li>Raggiunto il monte ore, i buchi si coprono con prestazioni aggiuntive (PA), solo di giorno (mai di notte), da chi ha già raggiunto il proprio monte ore e senza superare il limite di legge.</li>
        <li>Festivi: due strutturati per ogni festivo, come da foglio Festivi (se non compilato, il generatore sceglie due medici e li bilancia con lo storico).</li>
        <li>Fine settimana, cinque modi: ven notte + dom giorno; ven notte + dom notte; sab notte; sab giorno + dom notte; sab giorno + dom giorno. Il venerdì notte conta come fine settimana.</li>
        <li>Storico: notti, festivi, super festivi e saldo ore dei mesi chiusi riequilibrano il mese dopo (il saldo ore sposta il monte ore, fino a 24 h).</li>
        <li>Le notti a cavallo del mese e le ore della settimana precedente non sono note: per un giorno 1 di smonto usa «Non disp.».</li></ul></div>
    </div>`;

  function cellHTML(g, d, k, an, ws) {
    const c = g[d][k], col = (k === 2 ? ' col-n' : (k === 3 ? ' col-b' : '')) + (ws ? ' wkstart' : '');

    if (!c) {

      return `<button class="c unc${col}" ${att}>scoperto</button>`;
    }
    const doc = BYID[c.id]; if (!doc) return `<button class="c${col}" ${att}>${esc(c.id)}</button>`;
    const pa = an.paKeys.has(d + '-' + k);
    const bad = an.violations.some(v => v.id === c.id && v.d === d);
    return `<button class="c g-${cls(doc)}${col}${bad ? ' bad' : ''}" ${att}>${esc(doc.name)}${pa ? '<i class="pa">PA</i>' : ''}${c.lock ? '<i class="lk"></i>' : ''}</button>`;
  }

  function weeksBar(st, ctx) {
    return `<div class="weeks">${st.weekHours.map((h, w) => {
      const full = ctx.fullWeek[w];
      return `<div title="Settimana ${ctx.wfirst[w]}–${ctx.wlast[w]}"><i class="${full && h < 24 && !st.credit ? 'lo' : ''}" style="height:${Math.max(1, Math.round(h / 60 * 30))}px"></i>${h}</div>`;
    }).join('')}</div>`;

  function weekendCombos(an, ctx) {
    const g = gridOf(), out = [];
    const has = (d, k) => d && ((k === 2 ? [g[d][2]] : [g[d][0], g[d][1]]).some(c => c && c.id === cur));
    let cur = null;
    for (let w = 0; w < ctx.nW; w++) {
      if (!ctx.sat[w]) continue;
      const items = [];
      DOCS.forEach(doc => {
        cur = doc.id;
        const f = has(ctx.fri[w], 2), sd = has(ctx.sat[w], 0), sn = has(ctx.sat[w], 2), ud = has(ctx.sun[w], 0), un = has(ctx.sun[w], 2);
        if (!(f || sd || sn || ud || un)) return;
        let lab;
        if (f && ud && !sd && !sn && !un) lab = 'Ven notte + Dom giorno';
        else if (f && un && !sd && !sn && !ud) lab = 'Ven notte + Dom notte';
        else if (sn && !f && !sd && !ud && !un) lab = 'Sab notte';
        else if (sd && un && !f && !ud) lab = 'Sab giorno + Dom notte';
        else if (sd && ud && !f && !un) lab = 'Sab giorno + Dom giorno';
        else lab = [f && 'Ven notte', sd && 'Sab giorno', sn && 'Sab notte', ud && 'Dom giorno', un && 'Dom notte'].filter(Boolean).join(' + ') + ' (parziale)';
        items.push(`<span class="muted">${lab}:</span> <b>${doc.name}</b>`);
      });
      out.push(`<li><div class="small muted">Fine settimana del ${ctx.sat[w]}${ctx.sun[w] ? '–' + ctx.sun[w] : ''}</div><div class="small" style="line-height:1.7">${items.join('<br>') || '—'}</div></li>`);
    }
    return out.length ? `<ul class="list">${out.join('')}</ul>` : '<p class="muted">Nessun fine settimana.</p>';
  }

  function slugify(n) { return String(n).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '') || 'medico'; }
  function tabMedici() {

      <div class="card"><h2>Condividi i dati</h2>
        <p class="small muted" style="margin-bottom:8px">Ogni telefono tiene i suoi dati. Per avere la stessa cosa su un altro dispositivo, esporta qui e importa là. Ai colleghi basta mandare il PDF dei turni.</p>

    </div>`;

  function exportAll() {
    saveNow();
    const o = { v: 1, roster: DOCS, hist: HIST, months: {}, festivi: {} };
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || k.indexOf('turni-ps-susa-') !== 0 || k === HKEY || k === RKEY) continue;
        const v = JSON.parse(localStorage.getItem(k));
        if (k.indexOf('turni-ps-susa-festivi-') === 0) o.festivi[k] = v; else o.months[k] = v;
      }
    } catch (e) { }
    return JSON.stringify(o);
  }
  function importAll(text) {
    let o; try { o = JSON.parse(text); } catch (e) { S.msg = { t: 'warn', text: 'Il testo non è un file di dati valido.' }; render(); return; }
    if (!o || !Array.isArray(o.roster)) { S.msg = { t: 'warn', text: 'Non trovo i medici nei dati: controlla di aver copiato tutto.' }; render(); return; }
    DOCS = o.roster; rebuild(); HIST = { base: (o.hist && o.hist.base) || {}, closed: (o.hist && o.hist.closed) || {} };
    saveRoster(); saveHist();
    try {
      Object.keys(o.months || {}).forEach(k => { localStorage.setItem(k, JSON.stringify(o.months[k])); if (dbHandle && uid) { const mk = k.replace('turni-ps-susa-', ''); saving = saving.then(() => dbHandle.doc('data/users/' + uid + '/months/' + mk).set(o.months[k])).catch(() => { }); } });
      Object.keys(o.festivi || {}).forEach(k => { localStorage.setItem(k, JSON.stringify(o.festivi[k])); if (dbHandle && uid) { const mk = k.replace('turni-ps-susa-', ''); saving = saving.then(() => dbHandle.doc('data/users/' + uid + '/months/' + mk).set(o.festivi[k])).catch(() => { }); } });
    } catch (e) { }
    S.touched = false; const y = S.y, m = S.m; openMonth(y, m); S.tab = 'medici';
    S.msg = { t: 'ok', text: 'Dati importati: medici, storico, festivi e mesi.' }; render();
  }
  async function saveExport() {
    try {
      await deliver('turni-ps-susa-dati.json', exportAll(), 'application/json');
      S.msg = { t: 'ok', text: 'File dei dati pronto.' };
    } catch (e) { S.msg = { t: 'warn', text: e && e.code === 'declined' ? 'Salvataggio annullato.' : 'Il salvataggio di file non è disponibile qui: usa «Copia i dati».' }; }
    render();
  }

      ${ck.length ? '' : '<button class="btn" data-act="hseed">Carica lo storico da novembre 2025 a ottobre 2026</button>'}
      <div class="card"><h2>Mesi chiusi</h2>${ck.length ? `<ul class="list">${ck.map(c => `<li class="row" style="justify-content:space-between"><span>${c}</span><button class="btn" data-act="hopen" data-v="${c}">Riapri</button></li>`).join('')}</ul>` : '<p class="muted">Nessun mese chiuso. Chiudi il mese quando i turni sono definitivi.</p>'}</div>
      <details class="card"><summary><b>Valori iniziali</b> <span class="muted small">(prima del primo mese chiuso)</span></summary><div style="margin-top:10px">${form}</div></details>
    </div>`;
  }

  function tabCtrl() {
    const an = S.an, ctx = an.ctx, has = Object.keys(S.data.cells).length > 0;
    if (!has) return `<div class="page"><div class="card"><p class="muted">I controlli compaiono dopo la generazione dei turni.</p></div></div>`;
    const strut = ACT().filter(x => x.kind === 'S');
    const cards = strut.map(x => {
      const s = an.stats[x.id];
      const tot = s.hours + s.credit, pct = Math.min(100, s.T ? tot / s.T * 100 : 100);
      const dcls = Math.abs(s.diff) <= 6 ? 'ok' : (s.diff > 0 ? 'warn' : 'bad');
      const sign = s.diff > 0 ? '+' : (s.diff < 0 ? '−' : '');
      return `<div class="card dcard"><header><b>${x.name}</b><span class="pill ${dcls}">${sign}${fmt(Math.abs(s.diff))} h sul monte ore</span></header>
        <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
        <p class="small muted"><span class="mono">${s.days} turni = ${s.hours} h</span>${s.credit ? ` + <span class="mono">${fmt(s.credit)} h</span> ferie/corsi` : ''} su <span class="mono">${fmt(s.T)} h</span>${s.pa ? ` · <b style="color:var(--warn)">${s.pa} PA</b>` : ''}</p>
        <p class="small muted">Media settimanale (con lo storico): <b class="mono"${s.avgWeek > 48 ? ' style="color:var(--bad)"' : ''}>${fmt(s.avgWeek)} h</b> su 48${s.pa ? ` · PA: ${fmt(s.paHours)} h` : ''}</p>
        <div class="kv"><div><b>${s.nights}<span class="muted" style="font-weight:400">/${E.MAXN}</span></b>notti</div><div><b${s.weekends > E.MAXWE ? ' style="color:var(--warn)"' : ''}>${s.weekends}<span class="muted" style="font-weight:400">/${E.MAXWE}</span></b>fine settimana</div><div><b>${s.fest}</b>turni in festivi</div></div>
        ${weeksBar(s, ctx)}</div>`;
    }).join('');
    const exts = ACT().filter(x => x.kind !== 'S').filter(x => an.stats[x.id].days).map(x => { const s = an.stats[x.id]; return `<li class="row" style="justify-content:space-between"><span><span class="dot d-${cls(x)}" style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px"></span>${x.name} <span class="muted small">${GLABEL[x.grp]}</span></span><span class="mono small">${s.days} turni${s.nights ? ' · ' + s.nights + ' notti' : ''}</span></li>`; }).join('');
    const warns = [];
    const n118 = an.grpNights['118'] || 0, nLeo = an.grpNights['leo'] || 0;
    if (n118 < 3 && ACT().some(x => x.grp === '118')) warns.push(`Notti coperte dal 118: ${n118} (ne servono almeno 3). Servono più disponibilità.`);
    if (nLeo < 3 && ACT().some(x => x.grp === 'leo')) warns.push(`Notti coperte da Leoncini: ${nLeo} (ne servono almeno 3). Servono più disponibilità.`);
    const who = id => BYID[id] ? BYID[id].name : id;
    const dl = d => WDS[ctx.wd[d]] + ' ' + d;
    const issues = [];
    an.violations.forEach(v => issues.push(`<li><b>${who(v.id)}</b>: ${esc(v.t)}</li>`));
    an.uncovered.forEach(u => issues.push(`<li class="bad" style="background:var(--badbg);color:var(--bad)">Scoperto: ${dl(u.d)}, ${SLOTNAME[u.k]}</li>`));
    an.unused.forEach(u => issues.push(`<li>Disponibilità non usata: <b>${who(u.id)}</b>, ${dl(u.d)} (${LBL[u.code]}). Turno già coperto o cella fissata a mano.</li>`));
    strut.forEach(x => { const s = an.stats[x.id]; if (s.weekends > E.MAXWE) warns.push(`${x.name}: ${s.weekends} fine settimana. Va recuperato il mese dopo.`); });
    (an.holNotes || []).forEach(n => {
      const d = dl(n.d);
      if (n.plan) warns.push(`Festivo ${d}: il piano prevedeva ${n.plan.map(who).join(' e ')}${n.miss.length ? '; manca ' + n.miss.map(who).join(', ') : ''}${n.extra.length ? '; in più ' + n.extra.map(who).join(', ') : ''}.`);
      else warns.push(`Festivo ${d}: ${n.working.length} strutturati invece di 2 (${n.working.map(who).join(', ') || 'nessuno'}).`);
    });
    warns.forEach(w => issues.push(`<li style="background:var(--warnbg);color:var(--warn)">${w}</li>`));
    return `<div class="page">
      <div class="card"><h2>Da controllare</h2>${issues.length ? `<ul class="list">${issues.join('')}</ul>` : '<div class="note ok">Tutti i turni coperti e tutte le regole rispettate.</div>'}</div>
      <div class="grp-label" style="margin:2px 0 -6px">Strutturati</div>
      ${cards}
      <div class="card"><h2>Fine settimana</h2>${weekendCombos(an, ctx)}</div>
      <div class="card"><h2>Esterni e bassa intensità</h2>${exts ? `<ul class="list">${exts}</ul>` : '<p class="muted">Nessun turno assegnato.</p>'}</div>
    </div>`;
  }

  function sheetHTML() {
    const { d, k } = S.sheet, an = S.an, ctx = an.ctx;
    const cur = S.data.cells[d + '-' + k], curId = cur ? cur.replace('!', '') : null, locked = cur && cur.endsWith('!');
    const need = k === 2 ? 'N' : (k === 3 ? 'BI' : 'D');
    const cells = S.data.cells;
    const strut = ACT().filter(x => x.kind === 'S');
    const opt = x => {
      let why = '', tag = '';
      if (x.kind === 'S') {
        const probs = E.checkAssign(cfg(), cells, x.id, d, k);
        if (probs.length && x.id !== curId) why = `<span class="why">${esc(probs[0].t)}${probs.length > 1 ? ' (+' + (probs.length - 1) + ')' : ''}</span>`;
      } else {
        const a = (S.data.avail[x.id] || {})[d];
        if (a === need) tag = '<span class="tag">disponibile</span>';
      }
      return `<button class="opt ${curId === x.id ? 'cur' : ''}" data-act="pick" data-id="${x.id}"><span class="dot d-${cls(x)}"></span><span class="nm">${x.name}${why}</span>${tag}</button>`;
    };
    let ext = ACT().filter(x => x.kind !== 'S' && (k === 3 ? x.kind === 'B' : x.kind === 'E'));
    ext.sort((a, b) => (((S.data.avail[b.id] || {})[d] === need) - ((S.data.avail[a.id] || {})[d] === need)));
    return `<div class="ov" data-act="close"><div class="sheet" role="dialog" aria-label="Scegli il medico" data-stop="1">
      <h3>${WDS[ctx.wd[d]]} ${d} ${MESI[S.m]} · ${SLOTNAME[k]}</h3>
      ${k === 3 ? '' : `<div class="grp-label">Strutturati</div>${strut.map(opt).join('')}`}
      <div class="grp-label">${k === 3 ? 'Bassa intensità' : 'Esterni'}</div>${ext.map(opt).join('')}
      <div class="row" style="margin-top:8px">
        ${curId ? `<button class="btn" data-act="empty">Svuota la cella</button>` : ''}
        ${curId && BYID[curId] && BYID[curId].kind === 'S' && k !== 2 ? `<button class="btn" data-act="pa">${S.an.paKeys.has(d + '-' + k) ? 'Togli PA' : 'Segna PA'}</button>` : ''}
        ${locked ? `<button class="btn" data-act="unlock">Sblocca</button>` : ''}
        <button class="btn" data-act="close">Chiudi</button></div>
    </div></div>`;
  }

  function copyHTML() {
    const c = S.copy;
    return `<div class="ov" data-act="close"><div class="sheet" data-stop="1" role="dialog" aria-label="${esc(c.title)}">
      <h3>${esc(c.title)}</h3>
      ${c.ok ? '<div class="note ok">Copiato negli appunti.</div>' : '<p class="small muted">Gli appunti non sono disponibili qui. Seleziona il testo e copialo a mano.</p>'}
      <textarea class="cp" id="cptext" readonly>${esc(c.text)}</textarea>
      <button class="btn" data-act="close">Chiudi</button></div></div>`;
  }

  function render() {
    if (!BYID[S.person] || BYID[S.person].active === false) { const a = ACT()[0]; if (a) S.person = a.id; }
    let body = '';
    if (S.tab === 'mese') body = tabMese(); else if (S.tab === 'dispo') body = tabDispo(); else if (S.tab === 'turni') body = tabTurni(); else if (S.tab === 'fest') body = tabFest(); else if (S.tab === 'storico') body = tabStorico(); else if (S.tab === 'medici') body = tabMedici(); else body = tabCtrl();
    const keepY = window.scrollY;
    document.getElementById('app').innerHTML = header() + body + (S.sheet ? sheetHTML() : '') + (S.copy ? copyHTML() : '');
    if (S.tabChanged) { S.tabChanged = false; } else { window.scrollTo(0, keepY); }
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    if (t.classList.contains('ov') && e.target.closest('[data-stop]')) return;
    const a = t.dataset.act, v = t.dataset.v;
    if (a === 'tab') { S.tab = v; S.tabChanged = true; render(); window.scrollTo(0, 0); }
    else if (a === 'month') { let m = S.m + (+v), y = S.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } openMonth(y, m); window.scrollTo(0, 0); }
    else if (a === 'hol') toggleHoliday(+t.dataset.d);
    else if (a === 'person') { S.person = v; render(); }
    else if (a === 'brush') { S.brush[BYID[S.person].kind === 'S' ? 'S' : S.person] = v; render(); }
    else if (a === 'paint') paint(+t.dataset.d);
    else if (a === 'clearp') clearPerson();
    else if (a === 'gen') generate();
    else if (a === 'cell') { S.sheet = { d: +t.dataset.d, k: +t.dataset.k }; render(); }
    else if (a === 'pick') setCell(S.sheet.d, S.sheet.k, t.dataset.id);
    else if (a === 'empty') setCell(S.sheet.d, S.sheet.k, null);
    else if (a === 'unlock') unlockCell(S.sheet.d, S.sheet.k);
    else if (a === 'pa') togglePA(S.sheet.d, S.sheet.k);
    else if (a === 'pdf') savePdf();
    else if (a === 'close') { S.sheet = null; S.copy = null; render(); }
    else if (a === 'copyT') doCopy(tableText(), 'Tabella dei turni');
    else if (a === 'copyP') doCopy(personText(), 'Turni per medico');
    else if (a === 'copyH') doCopy(holesText(), 'Buchi da coprire');
    else if (a === 'radd') {
      const n = (document.getElementById('newname').value || '').trim(), c = document.getElementById('newcat').value;
      if (!n) { S.msg = { t: 'warn', text: 'Scrivi prima il cognome.' }; render(); }
      else {
        let id = slugify(n), base = id, i = 2; while (BYID[id]) id = base + (i++);
        const d = { id, name: n, active: true }; applyCat(d, c); DOCS.push(d); rebuild(); saveRoster(); S.msg = null; recompute(); render();
      }
    }
    else if (a === 'rdel') { const d = BYID[v]; if (d) { d.active = false; saveRoster(); S.data.dirty = true; recompute(); save(); render(); } }
    else if (a === 'rreact') { const d = BYID[v]; if (d) { d.active = true; saveRoster(); S.data.dirty = true; recompute(); save(); render(); } }
    else if (a === 'rexp') doCopy(exportAll(), 'Dati da portare su un altro dispositivo');
    else if (a === 'rsave') saveExport();
    else if (a === 'rimp') importAll(document.getElementById('impbox').value || '');
    else if (a === 'fplan') planYear();
    else if (a === 'fclear') { S.fest.assign = {}; saveFest(); S.data.dirty = true; recompute(); save(); render(); }
    else if (a === 'hclose') closeMonth();
    else if (a === 'hseed') { Object.keys(SEED_HIST).forEach(c => { if (!HIST.closed[c]) HIST.closed[c] = SEED_HIST[c]; }); saveHist(); S.msg = { t: 'ok', text: 'Caricati i mesi da novembre 2025 a ottobre 2026 (manca marzo). Maurino conta solo da ottobre (prima era gettonista). Il saldo ore parte da zero: ferie e corsi non sono nelle griglie.' }; recompute(); render(); }
    else if (a === 'hopen') { delete HIST.closed[v]; saveHist(); recompute(); render(); }
  });

  document.addEventListener('change', e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const a = t.dataset.act;
    if (a === 'rname') { const d = BYID[t.dataset.id]; const n = String(t.value).trim(); if (d && n) { d.name = n; saveRoster(); recompute(); render(); } else render(); }
    else if (a === 'rcat') { const d = BYID[t.dataset.id]; if (d) { applyCat(d, t.value); saveRoster(); S.data.dirty = true; recompute(); save(); render(); } }
    else if (a === 'rfile') { const f = t.files && t.files[0]; if (f) { const r = new FileReader(); r.onload = () => importAll(String(r.result || '')); r.readAsText(f); } }
    else if (a === 'fsel') {
      const k = t.dataset.k, i = +t.dataset.i, arr = (S.fest.assign[k] || ['', '']).slice(0, 2);
      while (arr.length < 2) arr.push('');
      arr[i] = t.value; S.fest.assign[k] = arr;
      if (!arr[0] && !arr[1]) delete S.fest.assign[k];
      saveFest(); S.data.dirty = true; recompute(); save(); render();
    } else if (a === 'fsup') { S.fest.sup[t.dataset.k] = t.checked; saveFest(); S.data.dirty = true; recompute(); save(); render(); }
    else if (a === 'hbase') {
      const id = t.dataset.id, f = t.dataset.f, v = parseFloat(String(t.value).replace(',', '.'));
      HIST.base[id] = HIST.base[id] || {}; HIST.base[id][f] = isNaN(v) ? 0 : v;
      saveHist(); recompute(); render();
    }
  });

  /* ---------- avvio ---------- */
  (function init() {
    const now = new Date();
    let y = now.getFullYear(), m = now.getMonth();
    if (now.getDate() >= 15) { m++; if (m > 11) { m = 0; y++; } }
    loadRoster(); loadHist(); openMonth(y, m);
    if (Object.keys(S.data.cells).length) S.tab = 'turni';
    render();
    (async () => {
      try {
        if (!window.claude || !window.claude.use) return;
        const user = await window.claude.use('user');
        const db = await window.claude.use('db');
        if (!db || !user) return;
        const id = await user.id();
        if (!id) return;
        dbHandle = db; uid = id;
        await loadRemote(key());
        try { const rs = await db.doc('data/users/' + id + '/months/medici').get(); if (rs.exists) { const o = rs.data(); if (o && Array.isArray(o.list) && o.list.length) { DOCS = o.list; rebuild(); try { localStorage.setItem(RKEY, JSON.stringify(DOCS)); } catch (e) { } recompute(); render(); } } } catch (e) { }
        try { const hs = await db.doc('data/users/' + id + '/months/storico').get(); if (hs.exists) { const o = hs.data(); HIST = { base: o.base || {}, closed: o.closed || {} }; try { localStorage.setItem(HKEY, JSON.stringify(HIST)); } catch (e) { } recompute(); render(); } } catch (e) { }
        try { const fs = await db.doc('data/users/' + id + '/months/festivi-' + S.y).get(); if (fs.exists) { const o = fs.data(); S.fest = { assign: o.assign || {}, sup: o.sup || {} }; recompute(); render(); } } catch (e) { }
      } catch (e) { }
    })();
  })();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body></html>
